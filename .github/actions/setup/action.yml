name: Set up STORMFEA
description: >
  Node, dependencies and (optionally) the TetGen/Gmsh binaries. Extracted from
  the old single-job workflow so the parallel jobs share one definition instead
  of four copies drifting apart.

inputs:
  meshers:
    description: >
      Install tetgen and gmsh. Needed by any job that meshes real geometry --
      without them the mesher integration tests (issue #108) and the adaptive
      fixtures self-skip, which is exactly how the #66 midnode-permutation bug
      shipped undetected. Set 'false' only for jobs that never mesh.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Validate package-lock.json exists
      shell: bash
      run: |
        if [ ! -f package-lock.json ]; then
          echo "ERROR: package-lock.json is missing!"
          echo "This file is required for npm ci to work correctly."
          exit 1
        fi
        echo "package-lock.json found"

    - name: Install meshing binaries (TetGen + Gmsh)
      if: inputs.meshers == 'true'
      shell: bash
      # The Ubuntu runner ships both in its default repos; update the index
      # first so the install is robust against a stale cache.
      #
      # DPkg::Lock::Timeout is not a nicety. By default apt waits FOREVER for
      # the dpkg lock, and the runner image's own unattended-upgrades can hold
      # it: observed on run 31104534659, where this step hung past 25 minutes
      # on one runner while two sibling jobs executing this same file finished
      # it in 19-21 s. Bounded waiting turns that indefinite hang into a
      # failure the job timeout and a re-run can deal with.
      run: |
        sudo apt-get -o DPkg::Lock::Timeout=300 update
        sudo apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends tetgen gmsh
        echo "tetgen: $(command -v tetgen)"
        echo "gmsh:   $(gmsh --version 2>&1)"

    - name: Set up Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'

    - name: Install project dependencies
      # `npm ci` already fails on a lock file that disagrees with package.json,
      # so the separate `npm ci --dry-run` verification pass the single-job
      # workflow ran first was doing the same resolution twice.
      shell: bash
      run: npm ci
